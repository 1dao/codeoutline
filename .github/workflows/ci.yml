name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vscode-client:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: adapters/vscode
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: adapters/vscode/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - name: Build Lua runtime for editor smoke test
        working-directory: .
        run: sh tools/build-runtime.sh
      - name: Run packaged extension in VS Code
        run: xvfb-run -a npm run test:editor
      - uses: actions/upload-artifact@v4
        with:
          name: codeoutline-vscode
          path: adapters/vscode/codeoutline.vsix
          if-no-files-found: error
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            host: win32-x64
            target: win32-x64
          - os: ubuntu-22.04
            host: linux-x64
            target: linux-x64
          - os: macos-14
            host: darwin-arm64
            target: darwin-universal
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify build host
        run: |
          $actual = node -p "process.platform + '-' + process.arch"
          if ($actual -ne '${{ matrix.host }}') { throw "Expected ${{ matrix.host }}, got $actual" }
      - name: Build Windows runtime
        if: runner.os == 'Windows'
        run: |
          ./tools/build-runtime.ps1
      - name: Build macOS runtime
        if: runner.os == 'macOS'
        shell: bash
        run: sh tools/build-runtime.sh
      # clang defaults to the runner's own macOS version as the minimum, which
      # would lock out older Macs; build-runtime.sh pins 11.0 for both slices.
      - name: Check macOS universal binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          archs=$(lipo -archs bin/xnet); echo "architectures: $archs"
          for arch in arm64 x86_64; do
            case " $archs " in *" $arch "*) ;; *) echo "bin/xnet lacks the $arch slice" >&2; exit 1;; esac
            minos=$(otool -arch "$arch" -l bin/xnet | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
            echo "$arch minos: $minos"
            if [ "$(printf '%s\n11.0\n' "$minos" | sort -V | tail -1)" != "11.0" ]; then
              echo "$arch slice needs macOS $minos; the baseline is 11.0" >&2
              exit 1
            fi
          done
      - name: Run the x86_64 slice under Rosetta
        if: runner.os == 'macOS'
        shell: bash
        run: |
          /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 ./bin/xnet tests/lua/codeoutline_spec.lua
          arch -x86_64 ./bin/xnet tests/lua/stability_spec.lua
      # A binary runs only on glibc >= the one it was built against, and the
      # hosted runners are newer than CentOS Stream 9 (2.34). Build on
      # manylinux_2_28 (AlmaLinux 8) so EL8/EL9, Debian 10+ and Ubuntu 20.04+ work.
      - name: Build Linux runtime (glibc 2.28 baseline)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src \
            quay.io/pypa/manylinux_2_28_x86_64 sh tools/build-runtime.sh
      - name: Check Linux glibc baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          need=$(objdump -T bin/xnet | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "highest glibc symbol version: $need"
          if [ "$(printf '%s\n2.28\n' "$need" | sort -V | tail -1)" != "2.28" ]; then
            echo "bin/xnet needs glibc $need; the baseline is 2.28" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run test:package
      - name: Run on the oldest and target Linux distributions
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # AlmaLinux 8 as shipped lacks the GBK converter, so those cases must
          # skip; CentOS Stream 9 gets glibc-gconv-extra and must run them.
          distro() {
            echo "::group::$1"
            docker run --rm -e HOME=/tmp -e OWNER="$(id -u):$(id -g)" -v "$PWD:/src" -w /src "$1" \
              sh tools/ci-distro-test.sh "${@:2}"
            local rc=$?
            echo "::endgroup::"
            return $rc
          }
          distro quay.io/almalinux/almalinux:8 0
          distro quay.io/centos/centos:stream9 1 glibc-gconv-extra
      - name: Stage artifacts
        run: |
          $runtime = if ($IsWindows) { './bin/xnet.exe' } else { './bin/xnet' }
          # Tag pushes stage publishable packages; package.lua checks the tag
          # against the version and refuses a dirty checkout.
          $release = '${{ github.ref_type }}' -eq 'tag'
          $releaseArgs = if ($release) { @('RELEASE=1', 'TAG=${{ github.ref_name }}') } else { @() }
          $suffix = if ($release) { '' } else { '-preview' }
          & $runtime tools/package.lua TARGET=${{ matrix.target }} OUTPUT=dist/${{ matrix.target }} LOG_STDERR=1 @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Staging failed' }
          if (-not $IsWindows) {
            chmod +x dist/${{ matrix.target }}/native/codeoutline dist/${{ matrix.target }}/native/bin/xnet
          }
          npm pack ./dist/${{ matrix.target }}/native --pack-destination ./dist
          if ($LASTEXITCODE -ne 0) { throw 'Native package failed' }
          npm pack ./dist/${{ matrix.target }}/npm --pack-destination ./dist
          if ($LASTEXITCODE -ne 0) { throw 'Entry package failed' }
          tar -czf "dist/codeoutline-${{ matrix.target }}$suffix.tar.gz" -C dist/${{ matrix.target }}/native .
          if ($LASTEXITCODE -ne 0) { throw 'Native archive failed' }
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: codeoutline-${{ matrix.target }}
          path: |
            dist/*.tgz
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
